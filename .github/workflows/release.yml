name: CI Build

# Continuous integration: builds and tests the mod on every push and pull
# request and uploads the artifacts. Publishing a real GitHub Release happens
# in release-publish.yml (triggered by version tags).
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (Minecraft 26.1.2 / Java 25)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read project version
        id: version
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Verify command surface (only /invre may be registered)
        run: |
          # Dynamic pattern (in(f|v)or) so this workflow itself never contains
          # one of the banned command names as a literal string.
          ! grep -rniE "(^|[^a-z])(/?)in(f|v)or" \
            src README.md RELEASE_NOTES.md docs gradle.properties build.gradle settings.gradle
          grep -rn 'Commands.literal("invre")' src/main/java/com/invrestore/command/InvRestoreCommand.java

      - name: Run tests
        run: ./gradlew clean test --console=plain

      - name: Run full build (JAR + project source ZIP)
        run: ./gradlew build --console=plain

      - name: Verify built JAR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR="build/libs/invrestore-${VERSION}.jar"
          test -f "$JAR"
          test -f "build/libs/invrestore-${VERSION}-sources.jar"
          test -f "build/distributions/invrestore-${VERSION}-project-sources.zip"
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "invrestore"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"environment": "server"'
          unzip -p "$JAR" com/invrestore/command/InvRestoreCommand.class > /tmp/InvRestoreCommand.class
          strings /tmp/InvRestoreCommand.class | grep -qx 'invre'
          if strings /tmp/InvRestoreCommand.class | grep -qE '/in(f|v)or'; then
            echo "Old command name found in compiled class"; exit 1
          fi
          echo "JAR verified: $JAR"

      - name: Upload mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: invrestore-mc26.1.2-java25
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload project source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: invrestore-sources-zip
          path: build/distributions/invrestore-*-project-sources.zip
          if-no-files-found: error
