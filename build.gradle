plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential repositories for Minecraft, Fabric Loader and Fabric API.
}

dependencies {
	// Minecraft 26.1 is unobfuscated, so no remapping is performed and plain
	// `implementation`/`compileOnly` configurations are used instead of
	// modImplementation/modCompileOnly.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

test {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName
	from('LICENSE') {
		rename { "${it}_$projectName" }
	}
}

// Full source ZIP of the project for releases. Contains exactly the tracked
// project content (sources, resources, build scripts, wrapper, workflow,
// docs) and excludes all build, IDE, OS and temporary files.
tasks.register('projectSourcesZip', Zip) {
	group = 'build'
	description = 'Packs the complete project sources (without build/IDE/temporary files) into build/distributions.'
	archiveBaseName = project.archives_base_name
	archiveClassifier = 'project-sources'
	archiveVersion = project.version
	destinationDirectory = layout.buildDirectory.dir('distributions')

	from(rootDir) {
		exclude 'build/**'
		exclude '.gradle/**'
		exclude '.git/**'
		exclude 'run/**'
		exclude 'logs/**'
		exclude '.idea/**'
		exclude '.vscode/**'
		exclude '*.iml'
		exclude '.DS_Store'
	}
}

// The source ZIP belongs to every successful build so releases always ship it.
tasks.named('build') {
	dependsOn projectSourcesZip
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
